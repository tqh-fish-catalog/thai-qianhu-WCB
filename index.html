<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Fraunces:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f6f8;--surface:#fff;--ink:#14202b;--muted:#5d6b78;--line:#dbe2e8;--accent:#1d4ed8;--accent-soft:#e6edfd;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e151b;--surface:#16212a;--ink:#e8eef3;--muted:#93a2af;--line:#26343f}}
*{box-sizing:border-box}
.msg{padding:40px 0;color:var(--muted);text-align:center}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding-bottom:90px}
header{padding:28px 20px 8px;max-width:1200px;margin:auto}
h1{font:700 clamp(26px,5vw,40px)/1.1 Fraunces,Georgia,serif;margin:0 0 6px}
header p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 20px;max-width:1200px;margin:auto;position:sticky;top:0;background:var(--bg);z-index:5}
.tab{flex:none;border:1.5px solid var(--c);color:var(--ink);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font:500 14px Inter,sans-serif;display:flex;gap:8px;align-items:center}
.tab i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.tab[aria-pressed=true]{background:var(--c);color:var(--on)}
.tab[aria-pressed=true] i{background:var(--on)}
.tab small{opacity:.7}
main{max-width:1200px;margin:auto;padding:0 20px}
.wrap{max-width:1200px;margin:auto;padding:12px 20px 0;display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start}
.wrap main{padding:0;max-width:none;margin:0;min-width:0}
aside{position:sticky;top:16px}
aside h2{font:700 20px Fraunces,Georgia,serif;margin:0 0 4px}
.fh{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px;color:var(--muted);font-size:13px}
.link{background:none;border:0;color:var(--accent);font:600 13px Inter,sans-serif;text-decoration:underline;cursor:pointer;padding:0}
.frow{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:6px;background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:10px;cursor:pointer;font-weight:500;font-size:14px}
.frow input{width:16px;height:16px;margin:0;accent-color:#fff}
.frow b{flex:1;font-weight:500;overflow-wrap:anywhere}.frow small{opacity:.7}
.frow.on{background:var(--d);border-color:var(--d);border-left-color:#fff;color:#fff}
.fbtn{display:none;width:100%;margin-bottom:10px;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:600 14px Inter,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 6px;min-height:28px}
.chip{display:flex;gap:6px;align-items:center;background:var(--d);color:#fff;border:0;border-radius:999px;padding:4px 6px 4px 12px;font:600 13px Inter,sans-serif;cursor:pointer}
.chip i{font-style:normal;background:rgba(255,255,255,.25);border-radius:50%;width:18px;height:18px;display:grid;place-items:center}
.rc{color:var(--muted);font-size:13px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{position:static}.fbtn{display:block}aside .panel{display:none}aside.open .panel{display:block}}
.lot{margin:8px 0 36px;--c:var(--accent)}
.lot-head{border-left:6px solid var(--c);padding:6px 0 6px 14px;margin:12px 0 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lot-head h2{font:700 24px Fraunces,Georgia,serif;margin:0}
.badge{background:var(--c);color:var(--on);border-radius:6px;padding:2px 9px;font-weight:600;font-size:13px}
.lot-head .n{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;border-top:4px solid var(--c)}
.card.sel{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.ph{aspect-ratio:1;background:var(--bg);cursor:zoom-in;position:relative}
.ph img,.ph video{width:100%;height:100%;object-fit:cover;display:block}
.ph video{pointer-events:none;background:#000}
.card.sold .ph img,.card.sold .ph video{filter:grayscale(1);opacity:.45}
.soldtag{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.soldtag span{background:#b91c1c;color:#fff;font-weight:700;letter-spacing:.08em;padding:4px 14px;border-radius:6px;transform:rotate(-12deg);font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed;background:transparent!important;color:var(--muted)!important;border-color:var(--line)!important}
.play{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;pointer-events:none}
#lb video{width:100%;max-height:75vh;display:block;background:#000}
.err{display:flex;height:100%;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:12px;color:var(--muted);cursor:default}
.meta{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;gap:6px}
.code{font-weight:600;font-variant-numeric:tabular-nums}
.btn{border:1.5px solid var(--c,var(--accent));background:transparent;color:var(--c,var(--accent));border-radius:8px;padding:5px 11px;font:600 13px Inter,sans-serif;cursor:pointer}
.card.sel .btn,.btn.fill{background:var(--c,var(--accent));color:var(--on,#fff)}
.btn.ghost{border-color:var(--line);color:var(--ink)}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
#fab{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:14px 26px;border:0;border-radius:999px;background:#1b2f4b;color:#fff;font:600 20px "Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.06em;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer;z-index:20;white-space:nowrap}
#fab span{background:#fff;color:#1b2f4b;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font:700 16px Inter,sans-serif;padding:0 6px}
#fab span.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
#ml h3{margin:0;font:700 32px "Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.04em;color:#1b2f4b;display:flex;justify-content:space-between;align-items:baseline}
@media (prefers-color-scheme:dark){#ml h3{color:var(--ink)}}
#ml h3 small{font:500 14px Inter,sans-serif;color:var(--muted);text-transform:none;letter-spacing:0}
.mlist{display:grid;gap:8px;max-height:52vh;overflow:auto}
.li{display:flex;gap:12px;align-items:center;border-left:5px solid var(--c);background:var(--bg);border-radius:8px;padding:6px 10px 6px 6px}
.li .th{width:62px;height:46px;border-radius:6px;object-fit:cover;background:#000;flex:none}
.li div{flex:1;min-width:0}.li b{display:block}.li span{color:var(--muted);font-size:13px}
.li button{border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;padding:4px 8px}
.macts .pri{background:#1b2f4b;border-color:#1b2f4b;color:#fff;font-size:16px}
@media (prefers-color-scheme:dark){.macts .pri{background:#3b5b86;border-color:#3b5b86}}
.macts{display:flex;gap:8px}.macts button{flex:1;padding:11px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 14px Inter,sans-serif;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:10}
.bar b{font-size:16px}
dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:20px;display:grid;gap:12px}
.dlg h3{margin:0;font:700 20px Fraunces,serif}
textarea,input,select{width:100%;font:14px Inter,sans-serif;padding:9px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:170px;font-family:ui-monospace,monospace}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.sum-lot{border-left:5px solid var(--c);padding-left:10px;margin:6px 0}
#lb{width:min(94vw,900px);background:#000;color:#fff}
#lb img{width:100%;max-height:75vh;object-fit:contain;display:block}
.lbbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:8px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Ornamental Fish Export Catalog</h1>
  <p>Tap a photo or video to open it. Press Select on the fish you like, then copy your order list and send it to us.</p>
</header>
<div class="wrap">
<aside id="aside" style="visibility:hidden">
  <button class="fbtn" id="fbtn"></button>
  <div class="panel">
    <h2>Filter by</h2>
    <div class="fh"><span>Categories</span><button class="link" id="fclr">Clear</button></div>
    <div id="rows"></div>
    <div class="fh" style="margin-top:14px"><span>Search</span></div>
    <input type="search" id="q" placeholder="e.g. H12" aria-label="Search" style="width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:14px Inter,sans-serif">
  </div>
</aside>
<main id="main"><p class="msg">Loading catalog…</p></main>
</div>

<button id="fab" aria-label="View my list">View my list <span id="fn">0</span></button>
<div id="toast"></div>

<dialog id="lb"><img id="lbImg" alt=""><video id="lbVid" controls playsinline hidden></video><div class="lbbar"><span id="lbCap"></span><span class="row" style="flex:none"><button class="btn fill" id="lbSel">Select</button><button class="btn ghost" style="color:#fff" id="lbClose">Close</button></span></div></dialog>

<dialog id="ml"><div class="dlg"><h3><span>My list</span><small id="mn"></small></h3><div class="mlist" id="mlist"></div><div class="macts"><button class="pri" id="mcopy">Copy list</button></div><div class="macts"><button id="mclr">Clear all</button><button id="mx">Close</button></div></div></dialog>

<script>
/* ================= SETTINGS (ไม่ต้องแก้ก็ใช้ได้) =================
   เว็บจะอ่านโฟลเดอร์ทั้งหมดใน Repo อัตโนมัติ: 1 โฟลเดอร์ = 1 หมวด
   ชื่อหมวด = ชื่อโฟลเดอร์ รูป = ทุกไฟล์รูปในโฟลเดอร์นั้น                    */
const GITHUB_REPO = "";   // เว้นว่างได้ถ้าใช้ที่อยู่ xxx.github.io/repo ; ถ้าใช้โดเมนของตัวเอง ใส่เช่น "myname/fish-catalog"
const OVERRIDES = {       // (ไม่บังคับ) ตั้งชื่อสวยหรือสีเฉพาะบางโฟลเดอร์
  // "M01": { title:"Betta Black Star", color:"#2563eb" },
};
const IGNORE_FOLDERS = ["node_modules","assets","docs"]; // โฟลเดอร์ที่ขึ้นต้นด้วย . หรือ _ ถูกข้ามอยู่แล้ว
/* ================================================================== */

const PALETTE=["#2563eb","#c2410c","#7e22ce","#0f766e","#be123c","#4d7c0f","#a16207","#0e7490","#4338ca","#9d174d"];
const IMG=/\.(jpe?g|png|webp|gif|avif)$/i;
const VID=/\.(mp4|webm|m4v|mov)$/i;
const $=s=>document.querySelector(s);
const nat=(a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"});
const code=n=>String(n); // รหัส = ชื่อไฟล์ (ไม่รวมนามสกุล)
const hash=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;return h};
const sel=new Map(); // folder -> Set of codes
let CATALOG=[], active="ALL", SOLD=new Set();
/* รายชื่อปลาที่ขายแล้วอยู่ในไฟล์ sold.txt (บรรทัดละ 1 รหัส) */
async function loadSold(){
  try{const r=await fetch("sold.txt?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;
    (await r.text()).split(/[\n,]/).forEach(x=>{x=x.replace(/#.*/,"").trim().toLowerCase();if(x)SOLD.add(x)})}catch(e){}}
const isSold=(l,it)=>SOLD.has(String(it.n).toLowerCase())||SOLD.has((l.folder+"/"+it.n).toLowerCase());

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1600)}
function isSel(f,n){return sel.has(f)&&sel.get(f).has(n)}

/* ---------- โหลดรายชื่อโฟลเดอร์/รูปจาก GitHub ---------- */
function detectRepo(){
  if(GITHUB_REPO)return GITHUB_REPO;
  const h=location.hostname;
  if(h.endsWith(".github.io")){
    const owner=h.split(".")[0],seg=location.pathname.split("/").filter(Boolean)[0];
    const repo=seg&&!/\.html?$/i.test(seg)?seg:owner+".github.io";
    return owner+"/"+repo}
  return null}
async function fetchTree(repo){
  const key="tree:"+repo;
  try{const c=JSON.parse(sessionStorage.getItem(key)||"null");if(c&&Date.now()-c.t<60000)return c.d}catch(e){}
  let lastErr;
  for(const ref of ["HEAD","main","master"]){
    try{
      const r=await fetch(`https://api.github.com/repos/${repo}/git/trees/${ref}?recursive=1`);
      if(r.status===403||r.status===429)throw new Error("RATE");
      if(!r.ok){lastErr=new Error("HTTP "+r.status);continue}
      const j=await r.json();
      try{sessionStorage.setItem(key,JSON.stringify({t:Date.now(),d:j.tree}))}catch(e){}
      return j.tree}
    catch(e){if(e.message==="RATE")throw e;lastErr=e}}
  throw lastErr||new Error("fetch failed")}
function buildCatalog(tree){
  const map={};
  tree.forEach(t=>{
    if(t.type!=="blob")return;
    const p=t.path.split("/");
    if(p.length!==2||!(IMG.test(p[1])||VID.test(p[1])))return;
    const f=p[0];
    if(/^[._]/.test(f)||IGNORE_FOLDERS.includes(f))return;
    (map[f]=map[f]||[]).push(p[1])});
  return Object.keys(map).sort(nat).map(f=>{
    const o=OVERRIDES[f]||{};
    const color=o.color||PALETTE[hash(f)%PALETTE.length];
    const files=map[f].sort(nat);
    const bases=files.map(f=>f.replace(/\.[^.]+$/,""));
    const items=files.map((file,i)=>{
      const dup=bases.filter(b=>b===bases[i]).length>1;
      return {n:dup?file:bases[i],file,video:VID.test(file)}});
    return {folder:f,title:o.title||f,color,items}})}

/* ---------- แสดงผล ---------- */
const showBadge=l=>l.title!==l.folder;
const src=(l,it)=>encodeURI(`${l.folder}/${it.file}`);
const lotBy=f=>CATALOG.find(l=>l.folder===f);
const selCats=new Set();let query="";
const dark=h=>{if(!/^#[0-9a-f]{6}$/i.test(h))return h;const n=parseInt(h.slice(1),16);return `rgb(${Math.round((n>>16&255)*.68)},${Math.round((n>>8&255)*.68)},${Math.round((n&255)*.68)})`};
function setUrl(){try{const u=new URL(location.href);selCats.size?u.searchParams.set("lot",[...selCats].join(",")):u.searchParams.delete("lot");history.replaceState(null,"",u)}catch(e){}}
function render(){
  $("#aside").style.visibility="visible";
  const rows=$("#rows");rows.innerHTML="";
  CATALOG.forEach(l=>{const on=selCats.has(l.folder);const r=document.createElement("label");r.className="frow"+(on?" on":"");
    r.style.cssText=`--c:${l.color};--d:${dark(l.color)}`;
    const cb=document.createElement("input");cb.type="checkbox";cb.checked=on;
    const b=document.createElement("b");b.textContent=l.title;const sm=document.createElement("small");sm.textContent=l.items.length;
    cb.onchange=()=>{on?selCats.delete(l.folder):selCats.add(l.folder);setUrl();render()};
    r.append(cb,b,sm);rows.appendChild(r)});
  const lots=CATALOG.filter(l=>!selCats.size||selCats.has(l.folder));
  const q=query.toLowerCase();
  const shown=lots.map(l=>({l,items:q?l.items.filter(it=>(String(it.n)+" "+l.title+" "+l.folder).toLowerCase().includes(q)):l.items})).filter(x=>x.items.length);
  const total=shown.reduce((a,x)=>a+x.items.length,0),n=selCats.size;
  $("#fbtn").textContent="Filters"+(n?` (${n})`:"");
  const main=$("#main");main.innerHTML="";
  const ch=document.createElement("div");ch.className="chips";
  CATALOG.filter(l=>selCats.has(l.folder)).forEach(l=>{const b=document.createElement("button");b.className="chip";b.style.setProperty("--d",dark(l.color));b.setAttribute("aria-label","Remove "+l.title);
    b.append(l.title);const x=document.createElement("i");x.textContent="×";b.appendChild(x);b.onclick=()=>{selCats.delete(l.folder);setUrl();render()};ch.appendChild(b)});
  const rc=document.createElement("span");rc.className="rc";rc.textContent=`${total} fish`+(n?` in ${n} categor${n>1?"ies":"y"}`:"");ch.appendChild(rc);
  main.appendChild(ch);
  if(!total){const e=document.createElement("p");e.className="msg";e.textContent="No fish match your filters.";main.appendChild(e)}
  shown.forEach(({l,items})=>{
    const sec=document.createElement("section");sec.className="lot";
    sec.style.setProperty("--c",l.color);sec.style.setProperty("--on","#fff");
    sec.innerHTML=`<div class="lot-head">${showBadge(l)?`<span class="badge">${l.folder}</span>`:""}<h2></h2><span class="n">${items.length} fish</span></div><div class="grid"></div>`;
    sec.querySelector("h2").textContent=l.title;
    const g=sec.querySelector(".grid");
    items.forEach(it=>g.appendChild(card(l,it)));
    main.appendChild(sec)});
  updateBar();
}
$("#q").oninput=e=>{query=e.target.value.trim();render()};
$("#fclr").onclick=()=>{selCats.clear();setUrl();render()};
$("#fbtn").onclick=()=>$("#aside").classList.toggle("open");
const vidObs=new IntersectionObserver((es)=>es.forEach(e=>{if(e.isIntersecting){const v=e.target;v.preload="metadata";v.src=v.dataset.src;vidObs.unobserve(v)}}),{rootMargin:"300px"});
function card(l,it){
  const n=it.n,c=document.createElement("div");c.className="card"+(isSel(l.folder,n)?" sel":"");
  c.dataset.f=l.folder;c.dataset.n=n;c.style.setProperty("--c",l.color);
  const ph=document.createElement("div");ph.className="ph";
  if(it.video){
    const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="none";v.dataset.src=src(l,it)+"#t=0.1";
    v.onerror=()=>{ph.innerHTML=`<div class="err">Video ${code(n)} unavailable</div>`;ph.style.cursor="default";ph.onclick=null};
    const tag=document.createElement("span");tag.className="play";tag.textContent="▶ Video";
    ph.append(v,tag);vidObs.observe(v);
  }else{
    const img=new Image();img.loading="lazy";img.alt=`${l.title} ${code(n)}`;img.src=src(l,it);
    img.onerror=()=>{ph.innerHTML=`<div class="err">Photo ${code(n)} unavailable</div>`;ph.style.cursor="default";ph.onclick=null};
    ph.appendChild(img);
  }
  ph.onclick=()=>openLb(l,it);
  const sold=isSold(l,it);
  if(sold){c.classList.add("sold");const t=document.createElement("div");t.className="soldtag";t.innerHTML="<span>SOLD OUT</span>";ph.appendChild(t)}
  const m=document.createElement("div");m.className="meta";
  m.innerHTML=`<span class="code">${code(n)}</span>`;
  const b=document.createElement("button");b.className="btn";b.textContent=isSel(l.folder,n)?"Selected ✓":"Select";
  b.setAttribute("aria-pressed",isSel(l.folder,n));
  if(sold){b.textContent="Sold out";b.disabled=true}
  b.onclick=()=>{toggle(l.folder,n);const on=isSel(l.folder,n);c.classList.toggle("sel",on);b.textContent=on?"Selected ✓":"Select";b.setAttribute("aria-pressed",on)};
  m.appendChild(b);c.append(ph,m);return c}
function toggle(f,n){
  if(!sel.has(f))sel.set(f,new Set());
  const s=sel.get(f);s.has(n)?s.delete(n):s.add(n);
  if(!s.size)sel.delete(f);updateBar()}
function total(){let t=0;sel.forEach(s=>t+=s.size);return t}
function updateBar(){
  const n=total(),f=$("#fab"),c=$("#fn");f.style.display=n?"flex":"none";
  if(c.textContent!=n){c.textContent=n;c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop")}
  if($("#ml").open)buildList()}
function syncCard(f,n){const c=document.querySelector(`.card[data-f="${CSS.escape(f)}"][data-n="${CSS.escape(String(n))}"]`);
  if(c){const on=isSel(f,n);c.classList.toggle("sel",on);const b=c.querySelector(".btn");b.textContent=on?"Selected ✓":"Select";b.setAttribute("aria-pressed",on)}}
function clearAll(){const keys=[];sel.forEach((v,f)=>v.forEach(n=>keys.push([f,n])));sel.clear();keys.forEach(([f,n])=>syncCard(f,n));updateBar();if($("#ml").open)$("#ml").close()}

/* Lightbox */
let lbCur=null;
function openLb(l,it){lbCur={l,n:it.n,sold:isSold(l,it)};
  const im=$("#lbImg"),vd=$("#lbVid");
  if(it.video){im.hidden=true;vd.hidden=false;vd.src=src(l,it);vd.play().catch(()=>{})}
  else{vd.hidden=true;im.hidden=false;im.src=src(l,it)}
  $("#lbCap").textContent=`${l.title} ${code(it.n)}`;syncLb();$("#lb").showModal()}
function syncLb(){const {l,n}=lbCur;const b=$("#lbSel");const so=lbCur.sold;b.disabled=so;b.textContent=so?"Sold out":isSel(l.folder,n)?"Selected ✓":"Select";b.style.setProperty("--c",l.color)}
$("#lbSel").onclick=()=>{if(lbCur.sold)return;toggle(lbCur.l.folder,lbCur.n);syncLb();
  const c=document.querySelector(`.card[data-f="${CSS.escape(lbCur.l.folder)}"][data-n="${CSS.escape(String(lbCur.n))}"]`);
  if(c){const on=isSel(lbCur.l.folder,lbCur.n);c.classList.toggle("sel",on);c.querySelector(".btn").textContent=on?"Selected ✓":"Select"}};
$("#lbClose").onclick=()=>$("#lb").close();
$("#lb").addEventListener("close",()=>{const v=$("#lbVid");v.pause();v.removeAttribute("src");v.load()});
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb")e.target.close()});

/* My list popup */
function buildList(){
  const l=$("#mlist");l.innerHTML="";let cnt=0;
  CATALOG.forEach(lot=>{if(!sel.has(lot.folder))return;
    [...sel.get(lot.folder)].sort(nat).forEach(n=>{const it=lot.items.find(x=>x.n===n);if(!it)return;cnt++;
      const d=document.createElement("div");d.className="li";d.style.setProperty("--c",lot.color);
      let th;if(it.video){th=document.createElement("video");th.muted=true;th.preload="metadata";th.src=src(lot,it)+"#t=0.1"}else{th=new Image();th.alt="";th.src=src(lot,it)}
      th.className="th";
      const t=document.createElement("div"),b=document.createElement("b"),sp=document.createElement("span");
      b.textContent=code(n);sp.textContent=lot.title;t.append(b,sp);
      const x=document.createElement("button");x.textContent="×";x.setAttribute("aria-label","Remove "+code(n));
      x.onclick=()=>{toggle(lot.folder,n);syncCard(lot.folder,n);if(!total())$("#ml").close()};
      d.append(th,t,x);l.appendChild(d)})});
  $("#mn").textContent=cnt+" selected"}
function orderText(){
  const lines=[];
  CATALOG.forEach(l=>{if(sel.has(l.folder)){const ns=[...sel.get(l.folder)].sort(nat);lines.push(`${showBadge(l)?`${l.title} (${l.folder})`:l.title}: ${ns.map(code).join(", ")}`)}});
  return lines.length?`Order inquiry — ${total()} fish\n\n${lines.join("\n")}`:""}
async function copy(t){
  try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();document.execCommand("copy");x.remove()}}
$("#mcopy").onclick=async()=>{const t=orderText();if(!t)return toast("Nothing selected");
  await copy(t);const b=$("#mcopy");b.textContent="Copied ✓";toast("Order list copied");setTimeout(()=>b.textContent="Copy list",1800)};
$("#fab").onclick=()=>{buildList();$("#ml").showModal()};
$("#mx").onclick=()=>$("#ml").close();
$("#mclr").onclick=clearAll;
$("#ml").addEventListener("click",e=>{if(e.target.id==="ml")e.target.close()});

/* ---------- เริ่มทำงาน ---------- */
(async()=>{
  const main=$("#main"),repo=detectRepo();
  const fail=t=>{main.innerHTML=`<p class="msg">${t}</p>`};
  if(!repo)return fail("Catalog can’t load here. Open it from your GitHub Pages address (username.github.io/repo), or set GITHUB_REPO in index.html.");
  try{await loadSold();CATALOG=buildCatalog(await fetchTree(repo))}
  catch(e){return fail(e.message==="RATE"?"GitHub is limiting requests right now. Please try again in a few minutes.":"Couldn’t read the catalog from GitHub. Check that the repository is public.")}
  if(!CATALOG.length)return fail("No photo folders found yet. Add folders with images to the repository.");
  const want=new URLSearchParams(location.search).get("lot");
  if(want)want.split(",").forEach(w=>{const m=CATALOG.find(l=>l.folder.toLowerCase()===w.trim().toLowerCase());if(m)selCats.add(m.folder)});
  render()})();
</script>
</body>
